<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080808">

  <title>Elias 1.3</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">

      <div>
        <h1>ELIAS</h1>

        <p id="status">
          online
        </p>
      </div>

      <div class="affection-box">
        🖤
        <span id="affection">0</span>
      </div>

    </header>


    <section class="room">

      <div
        id="speechBubble"
        class="speech-bubble"
      >
        Hey, Marie.
      </div>


      <div
        id="character"
        class="character"
      >

        <img
          id="eliasSprite"
          class="elias-sprite"
          src="https://i.postimg.cc/bD4fMZMM/elias-calm.png"
          alt="Elias"
        >

      </div>


      <div
        id="mori"
        class="mori hidden"
      >

        <img
          src="https://i.postimg.cc/HcF1KrK5/mori.png"
          class="mori-sprite"
          alt="Mori"
        >

        <span>Mori</span>

      </div>

    </section>


    <div class="mood-line">
      Mood:
      <span id="moodText">calm</span>
    </div>


    <!-- CHAT AREA -->

    <section
      id="chatHistory"
      class="chat-history"
    ></section>

    <div
  id="typingIndicator"
  class="typing-indicator hidden"
>
  Elias is typing<span class="dots">...</span>
</div>

    <form
      id="chatForm"
      class="chat-form"
    >

      <input
        id="chatInput"
        type="text"
        placeholder="Message Elias..."
        autocomplete="off"
        maxlength="500"
      >

      <button
        id="sendButton"
        type="submit"
      >
        Send
      </button>

    </form>


    <section class="buttons">

      <button
        id="pokeButton"
        class="secondary-button"
      >
        Poke Elias
      </button>

      <button
        id="moriButton"
        class="secondary-button"
      >
        Where's Mori?
      </button>

    </section>


    <footer>
      ELIAS 1.3
    </footer>

  </main>


  <script src="script.js"></script>

</body>

</html>
